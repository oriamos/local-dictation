<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <title>תמלול הרצאה</title>
  <!-- the plugin SDK ships with the editor (sdkjs-plugins/v1): no network needed -->
  <script src="../v1/plugins.js"></script>
  <script>
    // fallback: a copy of the SDK taken from the local editor install by the installer
    if (!window.Asc || !window.Asc.plugin) document.write('<script src="plugins.js"><\/script>');
  </script>
  <script src="settings.js"></script>
  <style>
    body { font-family: "Segoe UI", -apple-system, Arial, sans-serif; font-size: 12px; margin: 10px; color: #222; }
    h3 { margin: 0 0 8px; font-size: 13px; }
    label { display: block; margin: 8px 0 3px; color: #555; }
    input, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 5px; border: 1px solid #ccc; border-radius: 3px; }
    textarea { height: 70px; resize: vertical; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    button { flex: 1; padding: 7px 4px; font: inherit; border: 1px solid #bbb; border-radius: 3px; background: #f5f5f5; cursor: pointer; }
    button.primary { background: #d33; color: #fff; border-color: #c22; }
    button.mark { background: #fff3a0; border-color: #e0c800; }
    button:disabled { opacity: .45; cursor: default; }
    #status { margin-top: 12px; padding: 7px; border-radius: 3px; background: #f0f0f0; line-height: 1.5; }
    #status.rec { background: #ffecec; }
    #status.off { background: #fff4e5; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #999; margin-left: 5px; }
    .rec .dot { background: #e33; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    #catchup { display: none; margin-top: 8px; width: 100%; }
    small { color: #777; }
  </style>
</head>
<body>
  <h3>תמלול הרצאה חי</h3>
  <label for="title">שם ההרצאה</label>
  <input id="title" placeholder="למשל: אלגוריתמים – שיעור 5">
  <label for="terms">מונחים בהרצאה (שמות, מושגים) — מופרדים בפסיק</label>
  <textarea id="terms" placeholder="למשל: דייקסטרה, BFS, גרף מכוון, פרופ' כהן"></textarea>
  <div class="row">
    <button id="start" class="primary">● התחל</button>
    <button id="stop" disabled>■ עצור</button>
  </div>
  <div class="row">
    <button id="mark" class="mark" disabled>⭐ חשוב!</button>
  </div>
  <div id="status"><span class="dot"></span><span id="statusText">מתחבר ל-Local Dictation…</span></div>
  <button id="catchup">הכנס את כל התמלול עד עכשיו</button>
  <p><small>הטקסט נוסף בסוף המסמך — אפשר לערוך ולהוסיף הערות בכל מקום בזמן ההקלטה.
     גם השמע והתמלול נשמרים אוטומטית בתיקיית ההרצאה.</small></p>
  <script src="plugin.js"></script>
</body>
</html>
